<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>2026 북중미 월드컵 · 조별리그 & 토너먼트</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel2:#1c232d; --border:#2a323d;
    --text:#e6edf3; --muted:#8b949e; --accent:#3fb950; --accent2:#f0b429;
    --win:#3fb950; --live:#f85149; --chip:#21313d;
    --home:#58a6ff; --away:#ff7b72; --conn:#5b6674; --winline:#f85149;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f4f6f9; --panel:#ffffff; --panel2:#f0f3f7; --border:#d7dee6;
      --text:#1b2430; --muted:#5b6673; --accent:#1a7f37; --accent2:#9a6700;
      --win:#1a7f37; --live:#cf222e; --chip:#e3ecf5; --home:#0969da; --away:#cf222e;
      --conn:#aab4c0; --winline:#e5484d;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Segoe UI",Pretendard,-apple-system,"Malgun Gothic",sans-serif;
    -webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;z-index:20;background:var(--panel);
    border-bottom:1px solid var(--border);padding:12px 16px}
  .head-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    max-width:1400px;margin:0 auto}
  .brand{font-weight:800;font-size:18px;letter-spacing:-.3px;white-space:nowrap}
  .brand small{color:var(--muted);font-weight:600;font-size:12px;margin-left:6px}
  .tabs{display:flex;gap:6px;margin-left:6px}
  .tab{cursor:pointer;border:1px solid var(--border);background:var(--panel2);
    color:var(--muted);padding:7px 16px;border-radius:999px;font-size:14px;font-weight:700}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#04250f}
  @media (prefers-color-scheme: light){.tab.active{color:#fff}}
  .updated{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
  main{max-width:1400px;margin:0 auto;padding:18px 16px 60px}

  /* ── 조별리그 ── */
  .groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .gcard{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden}
  .gcard h3{margin:0;padding:11px 14px;background:var(--panel2);
    border-bottom:1px solid var(--border);font-size:15px;display:flex;align-items:center;gap:8px}
  .gbadge{background:var(--accent);color:#04250f;border-radius:7px;padding:2px 9px;font-weight:800;font-size:13px}
  @media (prefers-color-scheme: light){.gbadge{color:#fff}}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:6px 8px;text-align:center}
  th{color:var(--muted);font-weight:600;font-size:11px;border-bottom:1px solid var(--border)}
  td.team,th.team{text-align:left;font-weight:600;white-space:nowrap}
  tr.adv td{background:rgba(63,185,80,.08)}
  tr.adv3 td{background:rgba(240,180,41,.10)}
  .qual{font-size:10px;font-weight:800;border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle;white-space:nowrap}
  .q12{background:var(--accent);color:#04250f}
  .q3{background:var(--accent2);color:#3a2a00}
  .pts{font-weight:800}
  .gmatches{padding:8px 12px 12px;display:flex;flex-direction:column;gap:4px}
  .gmatches .sec{color:var(--muted);font-size:11px;font-weight:700;margin:6px 0 2px}
  .m{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;
    background:var(--panel2);cursor:pointer;font-size:13px}
  .m:hover{outline:1px solid var(--border)}
  .m .t1{flex:1;text-align:right}
  .m .t2{flex:1;text-align:left}
  .m .sc{font-weight:800;min-width:44px;text-align:center;
    background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:1px 0}
  .m .w{color:var(--win)}
  .m .goals{flex-basis:100%;display:none;margin-top:6px;padding-top:6px;
    border-top:1px dashed var(--border);font-size:12px;color:var(--muted)}
  .m.open .goals{display:flex;gap:14px}
  .goalcol{flex:1}
  .goalcol.right{text-align:right}
  .goalcol .g{white-space:nowrap}
  .goalcol .min{color:var(--accent2);font-weight:800;font-variant-numeric:tabular-nums}
  .goalcol .gteam{font-size:11px;font-weight:800;color:var(--text);
    margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid var(--border)}
  .goalcol .gnone{opacity:.45}
  .pk{opacity:.8;font-size:11px}

  /* ── 토너먼트 ── */
  .bwrap{overflow-x:auto;padding-bottom:14px}
  .bracket{display:flex;align-items:stretch;gap:0;min-width:1180px;position:relative}
  .connectors{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;z-index:0}
  .bracket .side,.bracket .final-col{position:relative;z-index:1}
  .side{display:flex;flex:1}
  /* 오른쪽 절반은 JS에서 [4강,8강,16강,32강] 순으로 구성 → 바깥(32강)에서 안쪽(4강)이 결승으로 수렴 */
  .round{display:flex;flex-direction:column;justify-content:space-around;flex:1;padding:0 10px}
  .rlabel{text-align:center;color:var(--muted);font-size:11px;font-weight:800;
    text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;position:sticky;top:0}
  .cell{display:flex;flex-direction:column;justify-content:center;flex:1;position:relative}
  .tie{background:var(--panel);border:1px solid var(--border);border-radius:10px;
    overflow:hidden;cursor:pointer}
  .tie.tbd{opacity:.5;cursor:default}
  .tie:hover:not(.tbd){border-color:var(--accent)}
  .tie .row{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:13px}
  .tie .row+.row{border-top:1px solid var(--border)}
  .tie .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tie .gs{font-weight:800;min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
  .tie .row.win{background:rgba(248,81,73,.08)}
  .tie .row.win .nm{font-weight:800;color:var(--winline)}
  .tie .row.win .gs{color:var(--winline)}
  .tie .row.lose{color:var(--muted)}
  .tie .meta{padding:4px 10px;font-size:10px;color:var(--muted);background:var(--panel2);
    display:flex;justify-content:space-between}
  .tie .meta .live{color:var(--live);font-weight:800}
  /* 연결선은 SVG(.connectors)로 그림 — drawConnectors() 참고 */
  .final-col{flex:0 0 210px;display:flex;flex-direction:column;justify-content:center;align-items:center}
  .champ{margin-top:14px;text-align:center}
  .champ .cup{font-size:30px}
  .champ .who{font-weight:800;font-size:16px;margin-top:4px}
  .champ .lbl{color:var(--muted);font-size:11px;font-weight:700}
  .tie.finaltie{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(240,180,41,.25)}

  /* 모달 */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
    align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal.open{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--border);border-radius:14px;
    max-width:460px;width:100%;max-height:85vh;overflow:auto}
  .sheet h4{margin:0;padding:14px 16px;border-bottom:1px solid var(--border);
    display:flex;align-items:center;justify-content:space-between;font-size:15px}
  .sheet .x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
  .sheet .body{padding:14px 16px}
  .score-big{text-align:center;font-size:26px;font-weight:800;margin-bottom:4px}
  .score-sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:14px}
  .tl{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 12px;align-items:center}
  .tl .h{text-align:right}
  .tl .a{text-align:left}
  .tl .mm{color:var(--accent2);font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
  .tl .th{font-weight:800;color:var(--text);font-size:13px;padding-bottom:5px;
    margin-bottom:3px;border-bottom:1px solid var(--border)}
  .tl .none{grid-column:1/4;text-align:center;color:var(--muted);padding:8px}

  .empty{text-align:center;color:var(--muted);padding:80px 20px;font-size:15px}

  @media (max-width:760px){
    .bracket{min-width:0;flex-direction:column}
    .side,.side.right{flex-direction:column}
    .round{padding:0}
    .side .round .cell::after{display:none}
    .final-col{flex:auto;margin:14px 0}
    .rlabel{margin-top:10px}
  }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <div class="brand">🏆 2026 북중미 월드컵<small>Canada · Mexico · USA</small></div>
    <div class="tabs">
      <div class="tab" data-view="groups">조별리그</div>
      <div class="tab" data-view="bracket">토너먼트</div>
    </div>
    <div class="updated" id="updated"></div>
  </div>
</header>
<main id="app"></main>

<div class="modal" id="modal">
  <div class="sheet">
    <h4><span id="mTitle"></span><span class="x" id="mClose">×</span></h4>
    <div class="body" id="mBody"></div>
  </div>
</div>

<script src="data.js"></script>
<script>
(function(){
  var D = window.WC_DATA || null;
  var app = document.getElementById('app');

  // ---------- helpers ----------
  function el(t){return document.createElement(t);}
  function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function goalStr(g){
    var pk = g.type==='penalty' ? ' <span class="pk">(PK)</span>'
           : g.type==='own' ? ' <span class="pk">(OG)</span>' : '';
    return '<span class="min">'+esc(g.minute)+"'</span> "+esc(g.player)+pk;
  }
  // 득점 주체가 홈 팀인지 판정 (데이터는 side 기준. team 명이 있으면 보조 사용)
  function isHomeGoal(g, m){
    return g.side==='home'
      || (g.team!=null && (g.team===m.home || g.team===m.homeTeamCode));
  }
  // "90+1" 같은 문자열 분을 정렬용 정수로
  function gmin(g){ var n=parseInt(String(g.minute),10); return isNaN(n)?0:n; }
  function played(m){return m && m.status && m.status!=='NS' && m.status!=='TBD'
    && m.homeScore!=null && m.awayScore!=null;}

  // ---------- 조별리그 ----------
  function renderGroups(){
    if(!D || !D.groups || !D.groups.length){ return emptyMsg(); }
    var wrap = el('div'); wrap.className='groups';
    D.groups.forEach(function(g){ wrap.appendChild(groupCard(g)); });
    return wrap;
  }
  function groupCard(g){
    var c = el('div'); c.className='gcard';
    var h='<h3><span class="gbadge">'+esc(g.name)+'</span> 조</h3>';
    // 순위표
    h+='<table><thead><tr>'
      +'<th class="team">팀</th><th>경기</th><th>승</th><th>무</th><th>패</th>'
      +'<th>득실</th><th>승점</th></tr></thead><tbody>';
    (g.standings||[]).forEach(function(s,i){
      var cls = i<2 ? 'adv' : (i===2 ? 'adv3' : '');
      var q = i<2 ? '<span class="qual q12">16강</span>'
            : (i===2 ? '<span class="qual q3">3위</span>' : '');
      var gd = (s.gd>0?'+':'')+s.gd;
      h+='<tr class="'+cls+'"><td class="team">'+esc(s.team)+q+'</td>'
        +'<td>'+esc(s.played)+'</td><td>'+esc(s.won)+'</td><td>'+esc(s.drawn)+'</td>'
        +'<td>'+esc(s.lost)+'</td><td>'+esc(s.gf)+':'+esc(s.ga)+' ('+gd+')</td>'
        +'<td class="pts">'+esc(s.points)+'</td></tr>';
    });
    h+='</tbody></table><div class="gmatches" data-matches></div>';
    c.innerHTML=h;
    var mc = c.querySelector('[data-matches]');
    (g.matches||[]).forEach(function(m){ mc.appendChild(matchRow(m)); });
    return c;
  }
  function matchRow(m){
    var row = el('div'); row.className='m';
    var hw = played(m) && m.homeScore>m.awayScore;
    var aw = played(m) && m.awayScore>m.homeScore;
    var sc = played(m) ? (m.homeScore+' : '+m.awayScore) : '-';
    var hg='',ag='';
    (m.goals||[]).slice().sort(function(a,c){return gmin(a)-gmin(c);}).forEach(function(g){
      var s='<div class="g">'+goalStr(g)+'</div>';
      if(isHomeGoal(g,m)) hg+=s; else ag+=s;
    });
    row.innerHTML =
      '<div class="t1'+(hw?' w':'')+'">'+esc(m.home)+'</div>'
      +'<div class="sc">'+sc+'</div>'
      +'<div class="t2'+(aw?' w':'')+'">'+esc(m.away)+'</div>'
      +'<div class="goals">'
      +'<div class="goalcol right"><div class="gteam">'+esc(m.home)+'</div>'
        +(hg||'<div class="g gnone">무득점</div>')+'</div>'
      +'<div class="goalcol"><div class="gteam">'+esc(m.away)+'</div>'
        +(ag||'<div class="g gnone">무득점</div>')+'</div></div>';
    if((m.goals||[]).length){
      row.addEventListener('click',function(){row.classList.toggle('open');});
    } else { row.style.cursor='default'; }
    return row;
  }

  // ---------- 토너먼트 ----------
  var ROUNDS=[['r32','32강',16],['r16','16강',8],['qf','8강',4],['sf','4강',2]];
  var REFS={left:null,right:null,final:null};  // 연결선 계산용 tie 요소/승자 정보
  var SVGNS='http://www.w3.org/2000/svg';
  function hasWinner(t){
    return played(t) && (t.winner!=null || t.homeScore!==t.awayScore);
  }
  function renderBracket(){
    if(!D || !D.knockout){ return emptyMsg(); }
    var k=D.knockout;
    var wrap=el('div'); wrap.className='bwrap';
    var b=el('div'); b.className='bracket';

    var svg=document.createElementNS(SVGNS,'svg'); svg.setAttribute('class','connectors');
    b.appendChild(svg);                       // 맨 아래(연결선) → 박스들이 위에
    b.appendChild(halfSide('left',k));
    b.appendChild(finalCol(k));
    b.appendChild(halfSide('right',k));

    wrap.appendChild(b);
    return wrap;
  }
  function halfSide(side,k){
    var s=el('div'); s.className='side '+side;
    // 라운드별 tie 요소를 논리 순서(r32→sf)로 수집
    var perRound={};
    ROUNDS.forEach(function(r){
      var key=r[0],total=r[2],half=total/2;
      var arr=k[key]||[];
      var slice = side==='left' ? arr.slice(0,half) : arr.slice(half,total);
      perRound[key]=slice.map(function(m){ return {el:tieBox(m,false), win:hasWinner(m)}; });
    });
    // 화면 컬럼 순서(왼쪽=바깥32강→안쪽4강, 오른쪽=반대)
    var order = side==='left' ? ROUNDS : ROUNDS.slice().reverse();
    order.forEach(function(r){ s.appendChild(roundCol(r[1], perRound[r[0]])); });
    REFS[side]=ROUNDS.map(function(r){ return perRound[r[0]]; });
    return s;
  }
  function roundCol(label,items){
    var col=el('div'); col.className='round';
    var lbl=el('div'); lbl.className='rlabel'; lbl.textContent=label; col.appendChild(lbl);
    items.forEach(function(it){
      var cell=el('div'); cell.className='cell';
      cell.appendChild(it.el);
      col.appendChild(cell);
    });
    return col;
  }
  // 대진표가 DOM에 붙은 뒤 호출: 박스 위치를 재서 전체 연결선을 SVG로 그림
  function drawConnectors(){
    var bracket=document.querySelector('.bracket'); if(!bracket) return;
    var svg=bracket.querySelector('svg.connectors'); if(!svg||!REFS.left) return;
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    if(window.innerWidth<=760) return;         // 모바일 세로 스택에선 연결선 생략
    var br=bracket.getBoundingClientRect();
    var W=bracket.scrollWidth, H=bracket.scrollHeight;
    svg.setAttribute('width',W); svg.setAttribute('height',H);
    svg.setAttribute('viewBox','0 0 '+W+' '+H);
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    function box(el){ var r=el.getBoundingClientRect(); return {
      l:r.left-br.left, r:r.right-br.left, cy:(r.top+r.bottom)/2-br.top }; }
    function line(childEl,parentEl,side,isWin){
      var c=box(childEl), p=box(parentEl);
      var cx = side==='left'? c.r : c.l;         // 자식은 중앙쪽으로 나감
      var px = side==='left'? p.l : p.r;         // 부모의 바깥쪽으로 들어옴
      var mx=(cx+px)/2;
      var d='M '+cx+' '+c.cy+' H '+mx+' V '+p.cy+' H '+px;
      var path=document.createElementNS(SVGNS,'path');
      path.setAttribute('d',d);
      path.style.fill='none';
      path.style.stroke = isWin?'var(--winline)':'var(--conn)';   // style로 지정해야 var() 해석됨
      path.style.strokeWidth = (isWin?3.5:1.8)+'px';
      path.style.strokeLinejoin='round';
      path.style.strokeLinecap='round';
      path.style.opacity = isWin?'1':'0.85';
      svg.appendChild(path);
    }
    ['left','right'].forEach(function(side){
      var rounds=REFS[side];                     // [r32[],r16[],qf[],sf[]]
      for(var r=0;r<3;r++){
        rounds[r].forEach(function(it,i){
          var parent=rounds[r+1][Math.floor(i/2)];
          if(parent) line(it.el, parent.el, side, it.win);
        });
      }
      if(rounds[3][0] && REFS.final) line(rounds[3][0].el, REFS.final.el, side, rounds[3][0].win);
    });
  }
  function finalCol(k){
    var col=el('div'); col.className='round final-col';
    var lbl=el('div'); lbl.className='rlabel'; lbl.textContent='결승'; col.appendChild(lbl);
    var f=k.final || {home:'미정',away:'미정',status:'TBD'};
    var ftie=tieBox(f,true);
    REFS.final={el:ftie, win:hasWinner(f)};
    col.appendChild(ftie);
    var champ=el('div'); champ.className='champ';
    var winner = f.winner || null;
    champ.innerHTML='<div class="cup">🏆</div><div class="lbl">우승</div>'
      +'<div class="who">'+esc(winner||'—')+'</div>';
    col.appendChild(champ);
    return col;
  }
  // 경기 일시 표기: kst 필드(한국시간 "MM-DD HH:mm")가 있으면 시간까지, 없으면 날짜만
  function fmtWhen(t){
    if(t.kst) return t.kst+' KST';
    return t.date||'';
  }
  function tieBox(t,isFinal){
    var box=el('div'); box.className='tie'+(isFinal?' finaltie':'');
    var done=played(t);
    var live = t.status==='LIVE'||t.status==='1H'||t.status==='2H'||t.status==='HT'||t.status==='ET';
    if(!t.home || t.home==='미정' || t.status==='TBD'){ box.className+=' tbd'; }
    var hw=done && (t.winner? t.winner===t.home : t.homeScore>t.awayScore);
    var aw=done && (t.winner? t.winner===t.away : t.awayScore>t.homeScore);
    function rowHtml(name,score,win,lose){
      return '<div class="row'+(win?' win':'')+(lose?' lose':'')+'">'
        +'<span class="nm">'+esc(name||'미정')+'</span>'
        +'<span class="gs">'+(score==null?'':esc(score))+'</span></div>';
    }
    var meta='';
    if(live) meta='<div class="meta"><span class="live">● LIVE</span><span>'+esc(fmtWhen(t))+'</span></div>';
    else if(done && t.detail) meta='<div class="meta"><span></span><span>'+esc(t.detail)+'</span></div>';
    else if(!done && (t.kst||t.date)) meta='<div class="meta"><span>⏱</span><span>'+esc(fmtWhen(t))+'</span></div>';
    box.innerHTML = rowHtml(t.home,done?t.homeScore:null,hw,done&&!hw)
      + rowHtml(t.away,done?t.awayScore:null,aw,done&&!aw) + meta;
    if(done && (t.goals||[]).length){
      box.addEventListener('click',function(){openModal(t);});
    } else if(!box.classList.contains('tbd')){
      box.style.cursor='default';
    }
    return box;
  }

  // ---------- 모달(득점 타임라인) ----------
  var modal=document.getElementById('modal');
  function openModal(t){
    document.getElementById('mTitle').textContent=(t.home||'')+' vs '+(t.away||'');
    var b=document.getElementById('mBody');
    var rows='';
    (t.goals||[]).slice().sort(function(a,c){return gmin(a)-gmin(c);}).forEach(function(g){
      var isHome = isHomeGoal(g,t);
      var txt=esc(g.player)+(g.type==='penalty'?' (PK)':g.type==='own'?' (OG)':'');
      rows+= isHome
        ? '<div class="h">⚽ '+txt+'</div><div class="mm">'+esc(g.minute)+"'</div><div class=\"a\"></div>"
        : '<div class="h"></div><div class="mm">'+esc(g.minute)+"'</div><div class=\"a\">"+txt+' ⚽</div>';
    });
    var head='<div class="th h">'+esc(t.home||'')+'</div><div class="th"></div>'
      +'<div class="th a">'+esc(t.away||'')+'</div>';
    if(!rows) rows='<div class="none">득점 정보 없음</div>';
    b.innerHTML='<div class="score-big">'+esc(t.homeScore)+' : '+esc(t.awayScore)+'</div>'
      +'<div class="score-sub">'+esc(t.date||'')+(t.detail?' · '+esc(t.detail):'')+'</div>'
      +'<div class="tl">'+head+rows+'</div>';
    modal.classList.add('open');
  }
  document.getElementById('mClose').onclick=function(){modal.classList.remove('open');};
  modal.addEventListener('click',function(e){if(e.target===modal)modal.classList.remove('open');});

  function emptyMsg(){
    var d=el('div'); d.className='empty';
    d.innerHTML='데이터 준비 중입니다.<br>업데이트 스크립트를 한 번 실행해 주세요.';
    return d;
  }

  // ---------- 라우팅 ----------
  var tabs=document.querySelectorAll('.tab');
  var curView='groups';
  function show(view){
    curView=view;
    tabs.forEach(function(t){t.classList.toggle('active',t.dataset.view===view);});
    app.innerHTML='';
    app.appendChild(view==='bracket'?renderBracket():renderGroups());
    if(location.hash!=='#'+view) history.replaceState(null,'','#'+view);
    if(view==='bracket'){
      // 레이아웃 확정 후 연결선 그리기 (두 프레임 뒤 폰트/줄바꿈 안정화)
      requestAnimationFrame(function(){ drawConnectors(); requestAnimationFrame(drawConnectors); });
    }
  }
  tabs.forEach(function(t){t.onclick=function(){show(t.dataset.view);};});
  window.addEventListener('hashchange',function(){
    show(location.hash==='#bracket'?'bracket':'groups');});
  var rz; window.addEventListener('resize',function(){
    if(curView!=='bracket') return;
    clearTimeout(rz); rz=setTimeout(drawConnectors,120);
  });

  if(D && D.updatedAt){
    var dt=new Date(D.updatedAt);
    document.getElementById('updated').textContent='업데이트: '+
      (isNaN(dt)? D.updatedAt : dt.toLocaleString('ko-KR'));
  }
  show(location.hash==='#bracket'?'bracket':'groups');
})();
</script>
</body>
</html>
